<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบความรู้เรื่องเกจแมนิโฟลด์ · HVAC Charging Game</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ================= ธีมสว่าง โทนฟ้าน้ำเงินเข้ม (เหมือนระบบหลัก) ================= */
        :root { color-scheme: light; }
        html { background-color: #f2f7ff; }
        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            color: #16233b;
            overflow-x: hidden;
            background-color: #ffffff;
            background-image:
                radial-gradient(1000px 640px at 12% 104%, rgba(29,78,216,0.40), transparent 60%),
                radial-gradient(1000px 620px at 92% 108%, rgba(14,165,233,0.32), transparent 58%),
                linear-gradient(180deg, #ffffff 0%, #eff6ff 16%, #cadefb 52%, #8fb9ef 100%);
            background-attachment: fixed;
        }
        #root { min-height: 100vh; }
        .glass-panel { background: rgba(255,255,255,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(37,99,235,0.28); }
        .frost-card { background: linear-gradient(180deg, #ffffff, #eaf2ff); border: 1px solid rgba(37,99,235,0.28); box-shadow: 0 22px 50px -22px rgba(20,55,120,0.45), inset 0 1px 0 rgba(255,255,255,0.95); }
        .glow-blue { box-shadow: 0 0 22px rgba(37,99,235,0.38); }
        ::-webkit-scrollbar { width: 9px; }
        ::-webkit-scrollbar-track { background: #b7d0f2; }
        ::-webkit-scrollbar-thumb { background: #1d4ed8; border-radius: 5px; }
        .gauge-needle { transform-origin: bottom center; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        /* ---- remap คลาสโทนเข้ม -> โทนสว่าง (เว้นเกจให้ยังเข้มแบบเครื่องมือจริง) ---- */
        .bg-slate-800, [class*="bg-slate-800/"] { background-color: #ffffff !important; }
        .bg-slate-900, [class*="bg-slate-900/"], .bg-slate-950 { background-color: #e0ecff !important; }
        .bg-slate-700 { background-color: #d5e5fd !important; }
        .diagram-board { background-color: #0b1a30 !important; border-color: #2b4a72 !important; }
        .diagram-board .bg-slate-800\/40, .diagram-board [class*="bg-slate-800/"] { background-color: rgba(30,41,59,0.4) !important; }
        .diagram-board .border-slate-700, .diagram-board .border-slate-600 { border-color: #334f74 !important; }
        .diagram-board .text-slate-400, .diagram-board .text-slate-500 { color: #94a3b8 !important; }
        .diagram-board .bg-slate-700 { background-color: #334155 !important; }
        .diagram-board .text-slate-300 { color: #cbd5e1 !important; }
        [class*="bg-[#08213f]"] { background-color: #cfe0fb !important; }
        .border-slate-500, .border-slate-600, .border-slate-700, .border-slate-800 { border-color: #a9c8ef !important; }
        .text-white { color: #0b2140 !important; }
        .text-slate-200, .text-slate-300 { color: #2b3a52 !important; }
        .text-slate-400, .text-slate-500, .text-slate-600 { color: #5b6b85 !important; }
        .text-blue-300, .text-sky-300, .text-cyan-300, .text-cyan-400 { color: #1e40af !important; }
        .text-blue-400 { color: #1d4ed8 !important; }
        [class*="text-sky-100"], [class*="text-sky-200"], [class*="text-cyan-100"], [class*="text-cyan-200"] { color: #2f5aa8 !important; }
        .text-yellow-400, .text-yellow-300 { color: #a1550a !important; }
        .text-red-400, .text-red-300 { color: #dc2626 !important; }

        /* ปุ่มพื้นสีทึบ -> ตัวอักษรขาว (ยกเว้นพิลล์โปร่งแสง …/20) */
        .bg-blue-600:not([class*="bg-blue-600/"]), .bg-cyan-600:not([class*="bg-cyan-600/"]),
        [class*="from-emerald-600"] { color: #ffffff !important; }
        [class*="from-sky-400"] { color: #062033 !important; }

        .pulse-red { animation: pulseRed 2s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .animate-fade-in { animation: fadeIn .4s ease both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        * { -webkit-tap-highlight-color: transparent; }
        button, [role="button"] { touch-action: manipulation; }
        .hscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .hscroll::-webkit-scrollbar { height: 6px; }
        @media (max-width: 640px) { body { font-size: 13px; } }

        /* ================= แดชบอร์ดสถิติ (ครูผู้สอน) ================= */
        .teacher-stats { --ts-ink:#0f2440; --ts-ink2:#3b5a82; --ts-muted:#7893b3;
            --ts-grid:#e3ecf7; --ts-baseline:#c7d6ea; --ts-pre:#2a78d6; --ts-post:#eb6834;
            --ts-good:#0ca30c; --ts-critical:#d03b3b; --ts-track:#e7edf6; color:var(--ts-ink); }
        .teacher-stats svg text { font-family: 'Sarabun', sans-serif; }
        .teacher-stats .ts-barval { font-size:12px; font-weight:700; fill:var(--ts-ink); }
        .teacher-stats .ts-axistxt { font-size:11px; fill:var(--ts-muted); }
        .teacher-stats .ts-cattxt { font-size:12.5px; fill:var(--ts-ink); font-weight:600; }
        .teacher-stats .ts-kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
        .teacher-stats .ts-kpi { background:#fff; border:1px solid rgba(42,120,214,0.15); border-radius:14px; padding:14px 16px; box-shadow:0 6px 18px -14px rgba(15,36,64,0.3); }
        .teacher-stats .ts-kpi .ts-label { font-size:12px; color:var(--ts-ink2); font-weight:600; margin-bottom:6px; }
        .teacher-stats .ts-kpi .ts-value { font-size:24px; font-weight:800; line-height:1; color:var(--ts-ink); }
        .teacher-stats .ts-kpi .ts-value small { font-size:13px; font-weight:600; color:var(--ts-muted); }
        .teacher-stats .ts-kpi .ts-delta { font-size:12px; font-weight:700; margin-top:6px; }
        .teacher-stats .ts-legend { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:8px; font-size:12.5px; color:var(--ts-ink2); font-weight:600; }
        .teacher-stats .ts-legend span { display:flex; align-items:center; gap:6px; }
        .teacher-stats .ts-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
        .teacher-stats .ts-dumb-wrap { display:flex; max-height:420px; overflow-y:auto; border:1px solid var(--ts-grid); border-radius:12px; }
        .teacher-stats .ts-dumb-names { flex:0 0 150px; border-right:1px solid var(--ts-grid); }
        .teacher-stats .ts-dumb-names div { height:24px; display:flex; align-items:center; padding:0 8px; font-size:11px; color:var(--ts-ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-bottom:1px solid #f1f5fb; }
        .teacher-stats .ts-dumb-names div:nth-child(odd) { background:#fbfdff; }
        .teacher-stats .ts-dumb-chart { flex:1; overflow:hidden; }
        .teacher-stats table.ts-datatable { width:100%; border-collapse:collapse; font-size:12px; }
        .teacher-stats table.ts-datatable th { position:sticky; top:0; background:#eef6ff; color:var(--ts-ink); font-weight:700; padding:7px 6px; text-align:center; border-bottom:2px solid var(--ts-grid); cursor:pointer; white-space:nowrap; }
        .teacher-stats table.ts-datatable th:hover { background:#cde2fb; }
        .teacher-stats table.ts-datatable td { padding:5px 6px; text-align:center; border-bottom:1px solid #f1f5fb; white-space:nowrap; }
        .teacher-stats table.ts-datatable td.ts-name { text-align:left; font-weight:600; }
        .teacher-stats table.ts-datatable tr:nth-child(even) { background:#fbfdff; }
        .teacher-stats .ts-pass { color:var(--ts-good); font-weight:700; }
        .teacher-stats .ts-fail { color:var(--ts-critical); font-weight:700; }
        .teacher-stats .ts-tablewrap { max-height:480px; overflow:auto; border:1px solid var(--ts-grid); border-radius:12px; }
        .teacher-stats .ts-searchbar { display:flex; align-items:center; gap:8px; margin-bottom:10px; background:#fff; border:1px solid var(--ts-grid); border-radius:10px; padding:7px 12px; max-width:300px; }
        .teacher-stats .ts-searchbar input { border:none; outline:none; font-family:inherit; font-size:13px; flex:1; color:var(--ts-ink); background:transparent; }
        .teacher-stats .ts-meter { flex:1; min-width:200px; }
        .teacher-stats .ts-meter .ts-mlabel { font-size:12px; font-weight:600; color:var(--ts-ink2); margin-bottom:5px; }
        .teacher-stats .ts-meter .ts-mtrack { height:12px; border-radius:8px; background:var(--ts-track); overflow:hidden; }
        .teacher-stats .ts-meter .ts-mfill { height:100%; border-radius:8px; background:var(--ts-good); }
        .teacher-stats .ts-meter .ts-mval { font-size:16px; font-weight:800; margin-top:4px; color:var(--ts-ink); }
        #ts-tt { position:fixed; pointer-events:none; background:#0f2440; color:#fff; font-size:12px; font-weight:600; padding:6px 10px; border-radius:8px; box-shadow:0 8px 18px -8px rgba(0,0,0,0.4); opacity:0; transition:opacity .1s; z-index:999; white-space:nowrap; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* ============================================================
           เกม "เลือก & เติมน้ำยา" — ตัดออกมาจากระบบสอบปฏิบัติช่างเครื่องทำความเย็น
           (ด่าน 6 เดิม) ให้เล่นเดี่ยวๆ ได้ ไม่ผูกกับระบบล็อกอิน/แผนที่/ผู้สอน
        ============================================================ */
        const PASS = 50;                                  // คะแนนผ่านเกณฑ์ (%)
        const starOf = (s) => s >= 98 ? 3 : s >= 90 ? 2 : s >= PASS ? 1 : 0;

        /* ============================================================
           ส่งผลทดสอบเข้า Google Sheet ผ่าน Apps Script Web App
           วิธีใช้: deploy Apps Script (ดูไฟล์ HVAC-ChargeGame-AppsScript-Code.gs.txt)
           แล้วนำลิงก์ที่ลงท้าย /exec มาวางที่ APPS_SCRIPT_URL ด้านล่าง
        ============================================================ */
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZBp1Nsiy7MJskgUQoPRfosZh7miogCaH2A7qJE8i8j2j01vSb6ry13yDzQidNKz09RA/exec';   // <<<< ลิงก์ Apps Script Web App (/exec) — วางหลัง deploy
        const submitResultToSheet = async (payload) => {
            if (!APPS_SCRIPT_URL) return { ok: false, reason: 'no-url' };
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 15000);
            try {
                // no-cors + text/plain = "simple request" ไม่ต้อง preflight · Apps Script รับได้
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    signal: ctrl.signal
                });
                return { ok: true };
            } catch (e) {
                return { ok: false, reason: String(e) };
            } finally {
                clearTimeout(timer);
            }
        };
        const buildResultPayload = (student, gameResult, quizResult, satAnswers) => {
            const g = gameResult || {}; const q = quizResult || {};
            const sat = satAnswers ? satSummary(satAnswers) : null;
            return {
                first: student.first, last: student.last, id: student.id, room: student.room,
                gameScore: g.score ?? null, gameFeedback: g.feedback || '',
                quizScore: q.score ?? null, quizCorrect: q.correct ?? null,
                finalScore10: (g.score != null && q.score != null) ? Number(((g.score + q.score) / 20).toFixed(1)) : null,
                satDim1: sat ? Number(sat.dims[0].mean.toFixed(2)) : null,
                satDim2: sat ? Number(sat.dims[1].mean.toFixed(2)) : null,
                satDim3: sat ? Number(sat.dims[2].mean.toFixed(2)) : null,
                satOverall: sat ? Number(sat.overall.toFixed(2)) : null,
                satLevel: sat ? sat.level : '',
                submittedAt: new Date().toISOString(),
                userAgent: (typeof navigator !== 'undefined' ? navigator.userAgent : '')
            };
        };

        const Stars = ({ n, size = 'text-base' }) => (
            <span className={size}>
                {[1, 2, 3].map(i => (
                    <i key={i} className={`fa-solid fa-star ${i <= n ? 'text-yellow-400' : ''}`} style={i <= n ? undefined : { color: '#c7d2e0' }}></i>
                ))}
            </span>
        );

        const TimerPill = ({ left }) => {
            const low = left <= 15;
            const mm = String(Math.floor(left / 60)).padStart(2, '0');
            const ss = String(left % 60).padStart(2, '0');
            return (
                <div className={`px-4 py-2 rounded-lg font-mono font-bold border text-sm ${low ? 'bg-red-600/20 border-red-500 text-red-400 pulse-red' : 'bg-slate-800 border-slate-600 text-slate-200'}`}>
                    <i className="fa-solid fa-stopwatch mr-2"></i>{mm}:{ss}
                </div>
            );
        };

        const MissionEnd = ({ score, maxScore, onBack, retry, feedback }) => {
            const passed = score >= PASS;
            return (
                <div className="frost-card flex flex-col items-center justify-center p-8 rounded-2xl max-w-lg mx-auto mt-10 text-center animate-fade-in relative overflow-hidden">
                    <div className="absolute -top-20 left-1/2 -translate-x-1/2 w-56 h-56 bg-sky-400/15 rounded-full blur-3xl pointer-events-none"></div>
                    <i className={`fa-solid ${passed ? 'fa-medal text-cyan-300 drop-shadow-[0_0_16px_rgba(56,189,248,0.6)]' : 'fa-triangle-exclamation text-red-400 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]'} text-7xl mb-3 relative z-10`}></i>
                    <h2 className="text-2xl font-bold mb-1 relative z-10 text-white">รายงานผลปฏิบัติงาน</h2>
                    <div className="relative z-10 my-2"><Stars n={starOf(score)} size="text-2xl" /></div>
                    <div className="text-5xl font-black my-3 relative z-10">
                        <span className={passed ? "text-cyan-300" : "text-red-400"}>{score}</span>
                        <span className="text-2xl text-sky-300/50"> / {maxScore}</span>
                    </div>
                    <div className={`text-sm font-bold mb-3 relative z-10 ${passed ? 'text-cyan-300' : 'text-red-400'}`}>
                        {passed ? '✅ ผ่านเกณฑ์' : `✗ ยังไม่ผ่าน (ต้องได้ ${PASS}% ขึ้นไป)`}
                    </div>
                    {feedback && <div className="bg-[#08213f]/80 p-4 rounded-lg text-sky-100/90 w-full mb-6 border border-sky-400/15 text-sm relative z-10">{feedback}</div>}
                    <div className="flex space-x-4 w-full relative z-10">
                        <button onClick={retry} className="flex-1 py-3 bg-[#0e2850] hover:bg-[#143567] border border-sky-400/25 rounded-lg font-semibold transition text-sky-100"><i className="fa-solid fa-rotate-right mr-2"></i> ลองใหม่ (ไม่บันทึก)</button>
                        <button onClick={onBack} className="flex-1 py-3 bg-gradient-to-r from-sky-400 to-cyan-300 hover:from-sky-300 hover:to-cyan-200 text-[#062033] rounded-lg font-bold transition glow-blue"><i className="fa-solid fa-arrow-right mr-2"></i> บันทึกผล → ทำแบบทดสอบความรู้</button>
                    </div>
                </div>
            );
        };

        /* ---- ถังน้ำยา ---- */
        const CHG_TANKS = [
            { id: 'R22',   name: 'R-22',   color: '#22c55e', th: 'ถังสีเขียว' },
            { id: 'R32',   name: 'R-32',   color: '#ec4899', th: 'ถังสีชมพู' },
            { id: 'R134A', name: 'R-134a', color: '#38bdf8', th: 'ถังสีฟ้า' },
            { id: 'R600A', name: 'R-600a', color: '#f97316', th: 'ถังสีส้ม' }
        ];

        const GameCharging = ({ mode, onFinish, chgKey }) => {
            const K = chgKey || {};
            const correctTankId = K.tank || 'R134A';
            const correctTank = CHG_TANKS.find(t => t.id === correctTankId) || CHG_TANKS[2];
            const chgMin = typeof K.chgMin === 'number' ? K.chgMin : 0;
            const chgMax = typeof K.chgMax === 'number' ? K.chgMax : 10;
            const shMin  = typeof K.shMin === 'number' ? K.shMin : 3;
            const shMax  = typeof K.shMax === 'number' ? K.shMax : 8;
            const [phase, setPhase] = useState('pick');       // pick | hookup | charge
            const [pickErr, setPickErr] = useState(false);
            const [pickMsg, setPickMsg] = useState('');
            const [conns, setConns] = useState([]);
            const [sel, setSel] = useState(null);
            const [hookMsg, setHookMsg] = useState('');
            const [hookErr, setHookErr] = useState(false);
            const [chargeLb, setChargeLb] = useState(3);
            const [pressure, setPressure] = useState(0);
            const [satTemp, setSatTemp] = useState(-0.5);
            const [suctionTemp, setSuctionTemp] = useState(13.5);
            const [valveOpen, setValveOpen] = useState(false);
            const [stabilizing, setStabilizing] = useState(0);
            const [result, setResult] = useState(null);

            const pickTank = (id) => {
                if (id === correctTankId) { setPickMsg(''); setPickErr(false); setPhase('hookup'); }
                else { setPickErr(true); setPickMsg(`❌ ผิดชนิด — งานนี้ระบบใช้ ${correctTank.name} (${correctTank.th}) เลือกใหม่`); }
            };

            const NODES = {
                MAN_L: { label: 'พอร์ตเกจ Low', x: 27, y: 22, dot: '#3b82f6' },
                MAN_C: { label: 'พอร์ตเกจ กลาง', x: 45, y: 22, dot: '#eab308' },
                MAN_H: { label: 'พอร์ตเกจ High', x: 63, y: 22, dot: '#ef4444' },
                SYS_L: { label: 'เซอร์วิสวาล์ว Low (ด้านดูด)', x: 16, y: 84 },
                CYL:   { label: 'ถังน้ำยา ' + correctTank.name, x: 45, y: 64 },
                SYS_H: { label: 'เซอร์วิสวาล์ว High (ด้านอัด)', x: 84, y: 84 }
            };
            const CORRECT = [['MAN_L', 'SYS_L'], ['MAN_C', 'CYL'], ['MAN_H', 'SYS_H']];
            const has = (a, b) => conns.some(c => (c[0] === a && c[1] === b) || (c[1] === a && c[0] === b));
            const hoseColor = (a, b) => {
                const m = a.startsWith('MAN') ? a : (b.startsWith('MAN') ? b : null);
                return NODES[m]?.dot || '#94a3b8';
            };
            const clickNode = (id) => {
                if (!sel) { setSel(id); return; }
                if (sel === id) { setSel(null); return; }
                const onePort = (sel.startsWith('MAN')) !== (id.startsWith('MAN'));
                if (onePort) {
                    const idx = conns.findIndex(c => (c[0] === sel && c[1] === id) || (c[1] === sel && c[0] === id));
                    if (idx >= 0) setConns(conns.filter((_, i) => i !== idx));
                    else setConns([...conns.filter(c => !c.includes(sel) && !c.includes(id)), [sel, id]]);
                }
                setSel(null);
            };
            const confirmHookup = () => {
                const missing = CORRECT.filter(([a, b]) => !has(a, b));
                const wrong = conns.filter(c => !CORRECT.some(([a, b]) => (a === c[0] && b === c[1]) || (a === c[1] && b === c[0])));
                if (!missing.length && !wrong.length) { setPhase('charge'); setHookMsg(''); return; }
                setHookErr(true);
                const m = [];
                if (has('MAN_L', 'SYS_H') || has('MAN_H', 'SYS_L')) m.push('สลับสายฟ้า/แดง — สายฟ้า (Low) ต่อด้านดูด, สายแดง (High) ต่อด้านอัด');
                if (has('MAN_C', 'SYS_L') || has('MAN_C', 'SYS_H')) m.push('สายกลาง (เหลือง) ต้องต่อเข้าถังน้ำยา ไม่ใช่เข้าเซอร์วิสวาล์ว');
                if (has('MAN_L', 'CYL') || has('MAN_H', 'CYL')) m.push('ถังน้ำยาต้องต่อกับพอร์ตกลางของเกจเท่านั้น');
                if (!m.length) m.push(`ต่อสายยังไม่ครบ/ไม่ถูก (ขาด ${missing.length} เส้น)`);
                setHookMsg(m.join(' · '));
            };

            useEffect(() => {
                if (phase !== 'charge' || result) return;
                const cv = Math.max(0, (chargeLb - 3) * 2);   // ค่าน้ำยาสะสม (เข็มนิ่ง) หน่วย PSI (~0–10 ในช่วงใช้งาน)
                let iv;
                if (valveOpen) {
                    // เปิดวาล์วเกจ -> น้ำยาไหลเข้า เข็ม "ตีขึ้น" ~+6 PSI จากค่านิ่ง + สะสมไปเรื่อยๆ
                    iv = setInterval(() => {
                        setChargeLb(p => Math.min(13, p + 0.05));
                        setStabilizing(0);
                        const surge = cv + 6 + Math.random() * 2;
                        setPressure(p => p + (surge - p) * 0.45);
                    }, 120);
                } else {
                    // ปล่อยวาล์ว -> เข็ม "ดีดลง" มาที่ค่าน้ำยาที่เติมจริง แล้วระบบค่อยๆ เข้าสมดุล
                    iv = setInterval(() => {
                        setStabilizing(p => Math.min(100, p + 6));
                        const sat = -8 + chargeLb * 2.5;
                        const suc = Math.max(sat, 15 - chargeLb * 0.5);   // จุดพอดี -> Superheat ~3–8
                        setPressure(p => p + (cv - p) * 0.16);
                        setSatTemp(sat);
                        setSuctionTemp(p => p + (suc - p) * 0.16);
                    }, 120);
                }
                return () => clearInterval(iv);
            }, [phase, valveOpen, chargeLb, result]);

            const superheat = suctionTemp - satTemp;
            const isStable = stabilizing >= 100;
            const chargeVal = Math.max(0, (chargeLb - 3) * 2);   // ค่าน้ำยาสะสม (เข็มนิ่ง) PSI

            const evaluate = () => {
                // คะแนนรวม = เลือกถัง (20) + ต่อสายเกจ (20) + เติมน้ำยา (60)
                const p1 = pickErr ? 8 : 20;
                const p2 = hookErr ? 10 : 20;
                if (!isStable) {
                    setResult({ score: p1 + p2, msg: `❌ ขั้นเติมน้ำยา = 0 (จบงานขณะระบบยังไม่เสถียร — ต้องปล่อยวาล์วรอเข็มนิ่งก่อน) · คะแนนรวม = ${p1 + p2}` });
                    return;
                }
                const chargeOK = chargeVal >= chgMin && chargeVal <= chgMax;
                const shOK = superheat >= shMin && superheat <= shMax;
                const p3 = (chargeOK && shOK) ? 60 : 0;
                const total = p1 + p2 + p3;
                if (p3 === 0) {
                    const bad = [];
                    if (!chargeOK) bad.push(`น้ำยาสะสม ${chargeVal.toFixed(1)} PSI เกินช่วง ${chgMin}–${chgMax}`);
                    if (!shOK) bad.push(`Superheat ${superheat.toFixed(1)}°C ไม่อยู่ในช่วง ${shMin}–${shMax}`);
                    setResult({ score: total, msg: `❌ ขั้นเติมน้ำยาไม่ผ่าน (${bad.join(' · ')}) = 0 หักล้างกับขั้นเลือกถัง/ต่อสาย · คะแนนรวม = ${total}` });
                } else {
                    const cut = [pickErr && 'เลือกถังผิด −12', hookErr && 'ต่อสายผิด −10'].filter(Boolean);
                    setResult({ score: total, msg: `✅ เติมน้ำยาสมบูรณ์! น้ำยาสะสม ${chargeVal.toFixed(1)} PSI · Superheat ${superheat.toFixed(1)}°C` + (cut.length ? ` · ${cut.join(', ')}` : '') });
                }
            };

            const reset = () => {
                setResult(null); setPhase('pick'); setPickErr(false); setPickMsg(''); setHookErr(false);
                setConns([]); setSel(null); setHookMsg('');
                setChargeLb(3); setPressure(0); setSatTemp(-0.5); setSuctionTemp(13.5);
                setValveOpen(false); setStabilizing(0);
            };

            if (result) return <MissionEnd score={result.score} maxScore={100} feedback={result.msg}
                onBack={() => onFinish(result.score, result.msg)} retry={reset} />;

            // ---------- PHASE 1 : เลือกถังน้ำยา ----------
            if (phase === 'pick') {
                return (
                    <div className="max-w-3xl mx-auto p-4 sm:p-6">
                        <h2 className="text-2xl font-bold text-cyan-400 mb-1">เติมน้ำยา — ขั้นที่ 1: เลือกถังน้ำยาให้ถูกชนิด</h2>
                        <p className="text-slate-300 text-sm mb-4">เลือกน้ำยาที่ตรงกับระบบเครื่องทำความเย็นในงานนี้</p>
                        {pickMsg && <div className="bg-red-900/30 border border-red-500/50 rounded-lg px-3 py-2 text-sm text-red-300 mb-3"><i className="fa-solid fa-triangle-exclamation mr-2"></i>{pickMsg}</div>}
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            {CHG_TANKS.map(t => (
                                <button key={t.id} onClick={() => pickTank(t.id)}
                                    className="flex flex-col items-center p-4 rounded-2xl border-2 border-slate-700 bg-slate-900 hover:border-slate-400 transition group">
                                    <div className="w-16 h-24 rounded-lg rounded-t-full border-2 shadow-inner mb-3 relative"
                                        style={{ background: t.color, borderColor: 'rgba(0,0,0,0.25)' }}>
                                        <div className="absolute -top-2 left-1/2 -translate-x-1/2 w-4 h-3 bg-slate-600 rounded-sm"></div>
                                    </div>
                                    <div className="font-bold text-white">{t.name}</div>
                                    <div className="text-xs text-slate-400">{t.th}</div>
                                </button>
                            ))}
                        </div>
                        {mode === 'practice' && <p className="text-yellow-400 text-xs mt-4"><i className="fa-solid fa-lightbulb"></i> งานนี้ระบบใช้ {correctTank.name} ({correctTank.th}) — R-22 เขียว, R-32 ชมพู, R-134a ฟ้า, R-600a ส้ม</p>}
                        {pickErr && (
                            <button onClick={() => onFinish(0, '⏭ ข้ามขั้นตอนเลือกถังน้ำยา (เลือกไม่ถูกต้อง) — ไปทำแบบทดสอบความรู้ต่อ · คะแนนเกม = 0')}
                                className="mt-5 text-sm text-blue-700 underline hover:text-blue-900">
                                ยังเลือกไม่ถูก? ข้ามไปทำแบบทดสอบความรู้เลย
                            </button>
                        )}
                    </div>
                );
            }

            // ---------- PHASE 2 : ต่อสายเกจ (สายกลางเข้าถังน้ำยา) ----------
            if (phase === 'hookup') {
                return (
                    <div className="max-w-4xl mx-auto p-4 sm:p-6">
                        <h2 className="text-2xl font-bold text-cyan-400 mb-1">เติมน้ำยา — ขั้นที่ 2: ต่อสายเกจ</h2>
                        <p className="text-slate-300 text-sm mb-2">ต่อชุดเกจแมนิโฟลด์เข้ากับ <span className="text-cyan-300">ถังน้ำยา</span> และเครื่องทำความเย็นให้ครบ 3 เส้น — คลิกจุดต่อ 2 จุดเพื่อโยงสาย</p>
                        <div className="flex flex-wrap gap-x-4 gap-y-1 mb-2 text-xs text-slate-400">
                            <span>ต่อแล้ว {conns.length}/3 เส้น</span>
                            <span className="text-slate-500">พอร์ตเกจมาตรฐาน:</span>
                            <span><span className="inline-block w-3 h-3 rounded-full bg-blue-500 align-middle mr-1"></span> Low</span>
                            <span><span className="inline-block w-3 h-3 rounded-full bg-yellow-500 align-middle mr-1"></span> กลาง (Service)</span>
                            <span><span className="inline-block w-3 h-3 rounded-full bg-red-500 align-middle mr-1"></span> High</span>
                        </div>
                        {hookMsg && <div className="bg-red-900/30 border border-red-500/50 rounded-lg px-3 py-2 text-sm text-red-300 mb-2"><i className="fa-solid fa-triangle-exclamation mr-2"></i>{hookMsg}</div>}

                        <div className="hscroll -mx-2 sm:mx-0">
                        <div className="relative diagram-board w-full min-w-[440px] h-[400px] sm:h-[520px] bg-slate-900 rounded-xl border border-slate-600 p-3 sm:p-4 shadow-inner overflow-hidden select-none">
                            <svg className="absolute inset-0 w-full h-full z-10 pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                                {conns.map((c, i) => {
                                    const a = NODES[c[0]], b = NODES[c[1]];
                                    const my = (a.y + b.y) / 2;
                                    return <path key={i} d={`M ${a.x} ${a.y} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}`} fill="none" stroke={hoseColor(c[0], c[1])} strokeWidth="4" strokeLinecap="round" vectorEffect="non-scaling-stroke" opacity="0.95" />;
                                })}
                            </svg>
                            <div className="absolute left-[18%] top-[6%] w-[54%] h-[26%] border-2 border-slate-600 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-300">ชุดเกจแมนิโฟลด์</div>
                            <div className="absolute left-[35%] top-[50%] w-[20%] h-[24%] border-2 border-slate-600 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-300">ถังน้ำยา {correctTank.name}</div>
                            <div className="absolute left-[3%] top-[76%] w-[94%] h-[22%] border-2 border-slate-600 rounded-lg bg-slate-800/40 pointer-events-none flex items-start justify-center pt-1.5 text-[11px] font-semibold text-slate-300">เครื่องทำความเย็น</div>

                            {Object.entries(NODES).map(([id, n]) => (
                                <div key={id} onClick={() => clickNode(id)}
                                    className="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center cursor-pointer z-20"
                                    style={{ left: `${n.x}%`, top: `${n.y}%` }}>
                                    <div className="w-8 h-8 rounded-full border-4 flex items-center justify-center shadow-lg transition-all"
                                        style={{ borderColor: sel === id ? '#ffffff' : (n.dot || '#64748b'), background: sel === id ? '#facc15' : '#334155', transform: sel === id ? 'scale(1.2)' : 'scale(1)' }}>
                                        <div className="w-1.5 h-1.5 rounded-full bg-slate-900"></div>
                                    </div>
                                    <span className="absolute top-9 px-1.5 py-0.5 rounded text-[10px] font-bold whitespace-nowrap border bg-slate-800 text-slate-300 border-slate-600">{n.label}</span>
                                </div>
                            ))}
                        </div>
                        </div>

                        {mode === 'practice' && <p className="text-yellow-400 text-xs mt-3"><i className="fa-solid fa-lightbulb"></i> สายฟ้า = พอร์ตเกจ Low → เซอร์วิสวาล์วด้านดูด · สายกลาง (เหลือง) = พอร์ตเกจกลาง → ถังน้ำยา · สายแดง = พอร์ตเกจ High → เซอร์วิสวาล์วด้านอัด</p>}
                        <button onClick={confirmHookup} className="w-full py-4 mt-4 bg-cyan-600 hover:bg-cyan-500 text-xl font-bold rounded-xl shadow-lg transition-colors">
                            <i className="fa-solid fa-plug-circle-check mr-2"></i> ยืนยันการต่อสาย → เริ่มเติมน้ำยา
                        </button>
                        {hookErr && (
                            <button onClick={() => onFinish(pickErr ? 8 : 20, '⏭ ข้ามขั้นตอนต่อสายเกจ (ต่อไม่ถูกต้อง) — ไปทำแบบทดสอบความรู้ต่อ')}
                                className="w-full mt-3 text-sm text-blue-700 underline hover:text-blue-900 text-center">
                                ยังต่อไม่ถูก? ข้ามไปทำแบบทดสอบความรู้เลย
                            </button>
                        )}
                    </div>
                );
            }

            // ---------- PHASE 3 : เติมน้ำยา ----------
            const needleRotation = -120 + (Math.min(Math.max(pressure, 0), 20) / 20 * 240);   // สเกลเกจ 0–20 PSI
            const chgPct = Math.min(100, Math.max(0, chargeVal / 12 * 100));
            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <div className="mb-4">
                        <h2 className="text-2xl font-bold text-cyan-400">เติมน้ำยา — ขั้นที่ 3: ชาร์จ {correctTank.name}</h2>
                        <p className="text-slate-400 text-sm">กดค้าง = เปิดเกจ เข็มตีขึ้น น้ำยาไหลเข้าสะสม · ปล่อย = เข็มดีดลงมาที่ค่าน้ำยาที่เติมจริง · ทำเป็นช่วงๆ ให้เข็มนิ่งอยู่ {chgMin}–{chgMax} PSI และ Superheat {shMin}–{shMax}°C</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 items-stretch mb-4">
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col justify-center shadow-lg">
                            <div className="text-xs font-bold text-blue-300 mb-2">ค่าฝั่งท่อดูด (Low Side)</div>
                            <div className="mb-2">
                                <div className="text-[11px] font-bold text-orange-400">อุณหภูมิท่อดูด</div>
                                <div className="text-2xl font-mono font-bold text-white">{suctionTemp.toFixed(1)} <span className="text-sm">°C</span></div>
                            </div>
                            <div>
                                <div className="text-[11px] font-bold text-purple-400">อุณหภูมิอิ่มตัว</div>
                                <div className="text-2xl font-mono font-bold text-white">{satTemp.toFixed(1)} <span className="text-sm">°C</span></div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col items-center justify-center shadow-lg">
                            <div className="text-xs font-bold text-blue-400 mb-2">LOW SIDE PRESSURE</div>
                            <div className="relative w-36 h-36 rounded-full border-[10px] border-blue-500 bg-slate-900 flex items-center justify-center shadow-inner">
                                <div className="absolute w-1 h-14 bg-red-500 rounded-t-full origin-bottom bottom-1/2 gauge-needle" style={{ transform: `rotate(${needleRotation}deg)` }}></div>
                                <div className="w-4 h-4 rounded-full bg-slate-300 z-10"></div>
                                <div className="absolute bottom-5 text-2xl font-mono font-black text-white">{pressure.toFixed(1)}</div>
                                <div className="absolute bottom-2 text-[10px] text-slate-500">PSI</div>
                            </div>
                            <div className="mt-3 w-full">
                                <div className="text-[10px] text-slate-500 uppercase tracking-wide text-center mb-1">น้ำยาสะสม (PSI)</div>
                                <div className="relative h-3 w-full bg-slate-900 rounded-full overflow-hidden border border-slate-700">
                                    <div className="absolute inset-y-0 left-0 bg-cyan-500 transition-all duration-150" style={{ width: `${Math.min(100, chargeVal / 20 * 100)}%` }}></div>
                                    {[5, 10, 15].map(t => (
                                        <div key={t} className="absolute inset-y-0 w-px bg-slate-600" style={{ left: `${t / 20 * 100}%` }}></div>
                                    ))}
                                </div>
                                <div className="relative w-full h-3 mt-0.5">
                                    {[0, 5, 10, 15, 20].map(t => (
                                        <span key={t} className={`absolute text-[9px] text-slate-500 font-mono ${t === 0 ? 'left-0' : t === 20 ? 'right-0' : '-translate-x-1/2'}`} style={t === 0 || t === 20 ? undefined : { left: `${t / 20 * 100}%` }}>{t}</span>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col items-center justify-center shadow-lg relative">
                            {!isStable && (
                                <div className="absolute inset-0 bg-slate-900/80 rounded-xl z-20 flex flex-col items-center justify-center backdrop-blur-sm">
                                    <i className="fa-solid fa-spinner fa-spin text-2xl text-yellow-400 mb-1"></i>
                                    <div className="text-yellow-400 font-bold text-xs">กำลังปรับสมดุลระบบ</div>
                                    <div className="w-20 h-1 bg-slate-700 mt-2 rounded overflow-hidden"><div className="h-full bg-yellow-400" style={{ width: `${stabilizing}%` }}></div></div>
                                </div>
                            )}
                            <div className="text-xs font-bold text-slate-300 mb-1">SUPERHEAT</div>
                            <div className={`text-5xl font-mono font-black ${isStable ? 'text-white' : 'text-slate-500'}`}>{isStable ? superheat.toFixed(1) : '-.-'}</div>
                            <div className="text-base text-slate-300 font-mono">°C</div>
                        </div>
                    </div>

                    <div className="mb-4">
                        <button onMouseDown={() => setValveOpen(true)} onMouseUp={() => setValveOpen(false)} onMouseLeave={() => setValveOpen(false)} onTouchStart={() => setValveOpen(true)} onTouchEnd={() => setValveOpen(false)}
                            className={`relative w-full py-6 rounded-xl font-bold text-xl shadow-lg transition-all border select-none overflow-hidden
                            ${valveOpen ? 'border-cyan-300 scale-[0.99]' : 'border-slate-500 hover:border-cyan-400'}`}>
                            <div className="absolute inset-0 bg-slate-700"></div>
                            <div className="absolute inset-y-0 left-0 bg-cyan-600/70 transition-all duration-150" style={{ width: `${chgPct}%` }}></div>
                            <span className="relative z-10 flex items-center justify-center text-white">
                                <i className={`fa-solid ${valveOpen ? 'fa-gas-pump fa-shake' : 'fa-hand-pointer'} mr-3`}></i>
                                {valveOpen ? `กำลังอัดน้ำยา... เข็มนิ่ง ${chargeVal.toFixed(1)} PSI` : `กดค้างเพื่อเติมน้ำยา (ปิด-เปิดเป็นช่วง) · เข็มนิ่ง ${chargeVal.toFixed(1)} PSI`}
                            </span>
                        </button>
                    </div>

                    {mode === 'practice' && <p className="text-yellow-400 text-xs mb-4 text-center"><i className="fa-solid fa-lightbulb"></i> เปิด-ปิดเป็นช่วง เข็มตีขึ้นแล้วปล่อยให้ลดลง · ปล่อยวาล์วรอ “ปรับสมดุลระบบ” ครบ 100% แล้วบันทึก · เกณฑ์ผ่าน: น้ำยาสะสม {chgMin}–{chgMax} PSI <b>และ</b> Superheat {shMin}–{shMax}°C (ถ้าหลุดเกณฑ์ ขั้นเติมน้ำยา = 0 หักล้างกับขั้นก่อนหน้า)</p>}

                    <button onClick={evaluate} className="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-lg font-bold rounded-xl shadow-lg border border-emerald-400 text-white transition-all">
                        <i className="fa-solid fa-clipboard-check mr-2"></i> ปิดวาล์วเกจ · บันทึกค่าและจบงาน
                    </button>
                </div>
            );
        };

        /* ============================================================
           หน้าลงทะเบียนผู้ทดสอบ — ชื่อ / นามสกุล / รหัสนักเรียน / ห้อง
        ============================================================ */
        const StudentLogin = ({ onStart, onTeacher, cheatMsg }) => {
            const [first, setFirst] = useState('');
            const [last, setLast] = useState('');
            const [sid, setSid] = useState('');
            const [room, setRoom] = useState('');
            const [err, setErr] = useState('');
            const submit = () => {
                if (!first.trim() || !last.trim() || !sid.trim() || !room.trim()) { setErr('กรอกข้อมูลให้ครบทุกช่อง'); return; }
                onStart({ first: first.trim(), last: last.trim(), id: sid.trim(), room: room.trim() });
            };
            const onEnter = (e) => { if (e.key === 'Enter') submit(); };
            const inputCls = "w-full bg-white border border-sky-400/40 rounded-lg px-3 py-2 mb-3 text-[#0f2440] outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-400/25 transition";
            return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="w-full max-w-sm frost-card rounded-2xl p-8 animate-fade-in relative overflow-hidden">
                        <div className="absolute -top-16 -right-16 w-40 h-40 bg-sky-400/20 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="text-center mb-5 relative">
                            <i className="fa-solid fa-temperature-half text-sky-300 text-5xl mb-3 drop-shadow-[0_0_16px_rgba(56,189,248,0.65)]"></i>
                            <h1 className="text-lg font-extrabold leading-[1.4] py-1 text-transparent bg-clip-text bg-gradient-to-r from-blue-800 to-blue-600">แบบทดสอบความรู้เรื่องเกจแมนิโฟลด์</h1>
                            <p className="text-xs text-blue-700/70 mt-1">กรอกข้อมูลผู้เข้าทดสอบก่อนเริ่ม</p>
                        </div>
                        <div className="bg-amber-50 border border-amber-300 rounded-lg px-3 py-2.5 mb-4 text-xs text-amber-800 relative z-10">
                            <div className="font-bold mb-1"><i className="fa-solid fa-shield-halved mr-1"></i> ข้อควรระวัง — ห้ามทุจริตระหว่างเล่นเกมและทำแบบทดสอบความรู้</div>
                            <ul className="list-disc list-inside space-y-0.5">
                                <li>ห้ามสลับแท็บ หรือย่อ/สลับหน้าต่างเบราว์เซอร์</li>
                                <li>ห้ามสลับไปแอปอื่นระหว่างทำ</li>
                                <li>ห้ามปิดหรือรีเฟรชหน้านี้</li>
                            </ul>
                            <div className="mt-1">ระบบตรวจจับอัตโนมัติ — พบว่าฝ่าฝืน จะถือว่า<b>ทุจริต</b> ยกเลิกผลและออกจากระบบทันที </div>
                        </div>
                        {cheatMsg && (
                            <div className="bg-red-100 border border-red-300 rounded-lg px-3 py-2 text-xs text-red-600 mb-4 relative z-10">
                                <i className="fa-solid fa-triangle-exclamation mr-1"></i> {cheatMsg}
                            </div>

        function tsShowTT(evt, text) {

        function tsGroupedBar(containerId, categories, seriesA, seriesB, opts) {
            opts = opts || {};

            const w = 680, rowH = 60, padL = 150, padR = 40, padTop = 10;
            const h = padTop + categories.length * rowH + 30;
            const scaleW = w - padL - padR;
            const x = v => (v / max) * scaleW;
            let bars = '';
            categories.forEach((cat, i) => {
                const cy = padTop + i * rowH;
                const barH = 18, gap = 6;
                const aW = x(seriesA[i]), bW = x(seriesB[i]);
                bars += `<text x="${padL - 10}" y="${cy + rowH / 2 + 4}" text-anchor="end" class="ts-cattxt">${cat}</text>`;
                bars += `<rect class="ts-hit" data-tt="${cat} · ก่อน: ${seriesA[i]}" x="${padL}" y="${cy + 8}" width="${aW}" height="${barH}" rx="4" fill="var(--ts-pre)"></rect>`;
                bars += `<text x="${padL + aW + 6}" y="${cy + 8 + barH / 2 + 4}" class="ts-barval">${seriesA[i]}</text>`;
                bars += `<rect class="ts-hit" data-tt="${cat} · หลัง: ${seriesB[i]}" x="${padL}" y="${cy + 8 + barH + gap}" width="${bW}" height="${barH}" rx="4" fill="var(--ts-post)"></rect>`;
                bars += `<text x="${padL + bW + 6}" y="${cy + 8 + barH + gap + barH / 2 + 4}" class="ts-barval">${seriesB[i]}</text>`;
            });
            let grid = '';
            const steps = opts.gridStep || (max / 5);
            for (let g = 0; g <= max; g += steps) {
                const gx = padL + x(g);
                grid += `<line x1="${gx}" y1="${padTop - 4}" x2="${gx}" y2="${padTop + categories.length * rowH}" stroke="var(--ts-grid)" stroke-width="1"></line>`;
                grid += `<text x="${gx}" y="${padTop + categories.length * rowH + 18}" text-anchor="middle" class="ts-axistxt">${g}</text>`;
            }
            if (opts.passLine) {
                const px = padL + x(opts.passLine);
                grid += `<line x1="${px}" y1="${padTop - 4}" x2="${px}" y2="${padTop + categories.length * rowH}" stroke="var(--ts-critical)" stroke-width="1.5" stroke-dasharray="4,3"></line>`;
            }
            const el = document.getElementById(containerId);
            if (!el) return;
            el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-width:${w}px;">${grid}${bars}</svg>`;
            tsWireHits(containerId);
        }
        function tsDumbbell(namesId, chartId, rows, preKey, postKey, max) {
            max = max || 10;

            namesEl.innerHTML = rows.map(r => `<div title="${r.name}">${r.id}. ${r.name}</div>`).join('');

            const scaleW = w - padL - padR;
            const x = v => padL + (v / max) * scaleW;

                const cy = i * rowH + rowH / 2;
                const pv = r[preKey], qv = r[postKey];
                marks += `<line x1="${x(pv)}" y1="${cy}" x2="${x(qv)}" y2="${cy}" stroke="var(--ts-muted)" stroke-width="2" opacity="0.5"></line>`;

                marks += `<circle class="ts-hit" data-tt="${r.name} · หลัง ${qv}" cx="${x(qv)}" cy="${cy}" r="4" fill="var(--ts-post)" stroke="#fff" stroke-width="2"></circle>`;

            if (!el) return;

        function tsHistogram(containerId, counts, xlabel) {
            const w = 440, h = 200, padL = 36, padB = 30, padT = 14, padR = 10;
            const maxN = Math.max(...counts.map(c => c.n));
            const barW = (w - padL - padR) / counts.length;
            let bars = '', axis = '';
            counts.forEach((c, i) => {
                const bh = (c.n / maxN) * (h - padT - padB);
                const bx = padL + i * barW + barW * 0.18;
                const bw = barW * 0.64;
                const by = h - padB - bh;
                bars += `<rect class="ts-hit" data-tt="ผลต่าง ${c.k}: ${c.n} คน" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="4" fill="var(--ts-pre)"></rect>`;
                bars += `<text x="${bx + bw / 2}" y="${by - 6}" text-anchor="middle" class="ts-barval">${c.n}</text>`;
                axis += `<text x="${bx + bw / 2}" y="${h - padB + 16}" text-anchor="middle" class="ts-axistxt">${c.k}</text>`;
            });
            axis += `<text x="${w / 2}" y="${h - 4}" text-anchor="middle" class="ts-axistxt">${xlabel}</text>`;
            const baseline = `<line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="var(--ts-baseline)" stroke-width="1"></line>`;
            const el = document.getElementById(containerId);

            el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-width:${w}px;">${baseline}${bars}${axis}</svg>`;

        /* ============================================================
           แบบทดสอบความรู้ปรนัย — เกจแมนิโฟลด์ / การทำความเย็น (ระดับ ปวช.2)
           10 ข้อ ข้อละ 10 คะแนน (เต็ม 100) — ทำต่อจากเล่นเกมจบ
        ============================================================ */
        const QUIZ_QUESTIONS = [
            { q: 'เกจฝั่งความดันต่ำ (Low Side) บนชุดเกจแมนิโฟลด์ ตามมาตรฐานมักทำเครื่องหมายด้วยสีใด?',
              choices: ['สีแดง', 'สีเหลือง', 'สีน้ำเงิน', 'สีเขียว'], correct: 2 },
            { q: 'เกจฝั่งความดันสูง (High Side) บนชุดเกจแมนิโฟลด์ ตามมาตรฐานมักทำเครื่องหมายด้วยสีใด?',
              choices: ['สีแดง', 'สีน้ำเงิน', 'สีเหลือง', 'สีดำ'], correct: 0 },
            { q: 'สายกลาง (Service Hose สีเหลือง) ของชุดเกจแมนิโฟลด์ ปกติใช้ต่อกับอุปกรณ์ใด?',
              choices: ['ขั้วไฟฟ้าคอมเพรสเซอร์โดยตรง', 'ปั๊มสุญญากาศ หรือ ถังน้ำยา', 'มอเตอร์พัดลมคอยล์ร้อน', 'สายดินของเครื่อง'], correct: 1 },
            { q: 'ก่อนเติมน้ำยาเข้าระบบทำความเย็น ควรทำขั้นตอนใดก่อนเสมอ?',
              choices: ['เปิดวาล์ว High ทันที', 'ทำสุญญากาศ (Vacuum) ไล่อากาศและความชื้นออกจากระบบ', 'ถอดคอมเพรสเซอร์ออกมาล้าง', 'เติมน้ำมันหล่อลื่นลงในถังน้ำยา'], correct: 1 },
            { q: 'ขณะคอมเพรสเซอร์กำลังทำงานปกติ เพราะเหตุใดจึงไม่ควรเปิดวาล์ว High (สีแดง) ของเกจแมนิโฟลด์?',
              choices: ['ทำให้หลอดไฟในบ้านดับ', 'ด้านอัดมีความดันสูงมาก อาจทำให้อุปกรณ์หรือเกจเสียหาย/อันตราย', 'ทำให้เกจอ่านค่าผิดเสมอ', 'ไม่มีผลกระทบใดๆ ทั้งสิ้น'], correct: 1 },
            { q: 'Superheat (ความร้อนยวดยิ่ง) ในงานทำความเย็น หมายถึงข้อใด?',
              choices: ['อุณหภูมิของคอมเพรสเซอร์ขณะทำงาน', 'ผลต่างระหว่างอุณหภูมิท่อดูดจริงกับอุณหภูมิอิ่มตัวที่ความดันเดียวกัน', 'อุณหภูมิของน้ำยาภายในถังบรรจุ', 'อุณหภูมิห้องขณะทำการทดสอบ'], correct: 1 },
            { q: 'ถ้าเติมน้ำยาเข้าระบบมากเกินไป (Overcharge) มักส่งผลอย่างไร?',
              choices: ['ความดันทั้งฝั่ง Low และ High สูงกว่าปกติ ประสิทธิภาพการทำความเย็นลดลง', 'ระบบเย็นเร็วขึ้นและประหยัดไฟมากขึ้น', 'คอมเพรสเซอร์ทำงานเบาลงกว่าเดิม', 'ไม่มีผลกระทบต่อระบบเลย'], correct: 0 },
            { q: 'เมื่อจะต่อชุดเกจแมนิโฟลด์เข้ากับถังน้ำยา ควรใช้สายเส้นใด?',
              choices: ['สายฟ้า (Low)', 'สายแดง (High)', 'สายกลาง (Service Hose)', 'สายดินของเกจ'], correct: 2 },
            { q: 'หน้าปัดเกจแมนิโฟลด์ทั่วไป แสดงค่าความดันเป็นหน่วยใดเป็นหลัก?',
              choices: ['PSI (ปอนด์ต่อตารางนิ้ว)', 'แอมแปร์ (A)', 'โวลต์ (V)', 'เฮิรตซ์ (Hz)'], correct: 0 },
            { q: 'ก่อนถอดชุดเกจแมนิโฟลด์ออกจากระบบหลังทำงานเสร็จ ควรทำสิ่งใดก่อนเสมอ?',
              choices: ['ปิดวาล์ว Low และ High ของเกจให้สนิทก่อนถอดสาย', 'ถอดสายกลาง (Service Hose) ออกก่อนเป็นอันดับแรกโดยไม่ต้องปิดวาล์ว', 'เปิดวาล์ว High ค้างไว้เพื่อระบายความดัน', 'ไม่จำเป็นต้องปิดวาล์วใดๆ ก่อนถอด'], correct: 0 }
        ];

        const QuizSection = ({ onSubmit }) => {
            const [answers, setAnswers] = useState({});
            const [showErr, setShowErr] = useState(false);
            const answeredCount = Object.keys(answers).length;
            const allAnswered = answeredCount === QUIZ_QUESTIONS.length;

            const submit = () => {
                if (!allAnswered) { setShowErr(true); return; }
                let correct = 0;
                QUIZ_QUESTIONS.forEach((q, i) => { if (answers[i] === q.correct) correct++; });
                onSubmit(correct * 10, correct);
            };

            return (
                <div className="max-w-3xl mx-auto p-4 sm:p-6 animate-fade-in">
                    <h2 className="text-2xl font-bold text-cyan-400 mb-1"><i className="fa-solid fa-list-check mr-2"></i>แบบทดสอบความรู้ — เกจแมนิโฟลด์ & การทำความเย็น</h2>
                    <p className="text-slate-500 text-sm mb-4">ตอบให้ครบทุกข้อ ({answeredCount}/{QUIZ_QUESTIONS.length}) แล้วกดส่งคำตอบ · ข้อละ 10 คะแนน (เต็ม 100)</p>
                    {showErr && !allAnswered && <div className="bg-red-100 border border-red-300 rounded-lg px-3 py-2 text-sm text-red-600 mb-4"><i className="fa-solid fa-triangle-exclamation mr-2"></i>กรุณาตอบให้ครบทุกข้อก่อนส่งคำตอบ</div>}
                    <div className="space-y-4 mb-6">
                        {QUIZ_QUESTIONS.map((q, i) => (
                            <div key={i} className="frost-card rounded-xl p-4">
                                <div className="font-semibold text-[#0f2440] mb-3">{i + 1}. {q.q}</div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    {q.choices.map((c, ci) => {
                                        const sel = answers[i] === ci;
                                        return (
                                            <button key={ci} onClick={() => { setAnswers(a => ({ ...a, [i]: ci })); setShowErr(false); }}
                                                className={`text-left px-3 py-2 rounded-lg border text-sm transition ${sel ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-300 text-[#2b3a52] hover:border-blue-400'}`}>
                                                <span className="font-bold mr-2">{String.fromCharCode(65 + ci)}.</span>{c}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>
                    <button onClick={submit} className="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-lg font-bold rounded-xl shadow-lg border border-emerald-400 transition-all">
                        <i className="fa-solid fa-paper-plane mr-2"></i> ส่งคำตอบแบบทดสอบ
                    </button>
                </div>
            );
        };

        /* ============================================================
           แบบประเมินความพึงพอใจต่อสื่อวิดีโอ — 15 ข้อ (3 ด้าน ด้านละ 5 ข้อ)
           ทำต่อจากทำแบบทดสอบความรู้เสร็จ ก่อนดูคะแนนรวม
        ============================================================ */
        const SAT_ITEMS = [
            { dim: 'ด้านที่ 1 คุณภาพสื่อวิดีโอ', items: [
                'เนื้อหาในสื่อวิดีโอมีความชัดเจน เข้าใจง่าย',
                'ภาพและเสียงในสื่อวิดีโอมีความคมชัด',
                'ขั้นตอนการสาธิตในวิดีโอเรียงลำดับได้เหมาะสม',
                'สามารถหยุดและเล่นซ้ำในจุดที่ไม่เข้าใจได้สะดวก',
                'ความยาวของสื่อวิดีโอแต่ละตอนมีความเหมาะสม'
            ]},
            { dim: 'ด้านที่ 2 การจัดกิจกรรมการเรียนรู้', items: [
                'กิจกรรมการเรียนรู้มีความเหมาะสมกับเนื้อหา',
                'มีเวลาเพียงพอสำหรับการฝึกปฏิบัติจริง',
                'ครูผู้สอนให้คำแนะนำอย่างทั่วถึง',
                'ลำดับขั้นตอนการจัดกิจกรรมมีความเหมาะสม',
                'บรรยากาศในการเรียนรู้เอื้อต่อการฝึกปฏิบัติ'
            ]},
            { dim: 'ด้านที่ 3 ประโยชน์ที่ได้รับ', items: [
                'ทำให้มีความรู้ความเข้าใจเรื่องเกจแมนิโฟลด์เพิ่มขึ้น',
                'ทำให้มีทักษะการใช้งานและการอ่านค่าเกจแมนิโฟลด์ดีขึ้น',
                'สามารถนำความรู้ไปประยุกต์ใช้ในการฝึกงาน/การทำงานจริงได้',
                'เพิ่มความมั่นใจในการปฏิบัติงานกับเครื่องมือวัด',
                'ต้องการให้มีสื่อวิดีโอลักษณะนี้ในรายวิชาอื่นเพิ่มเติม'
            ]}
        ];
        const SAT_SCALE = [5, 4, 3, 2, 1];
        const SAT_SCALE_LABEL = { 5: 'มากที่สุด', 4: 'มาก', 3: 'ปานกลาง', 2: 'น้อย', 1: 'น้อยที่สุด' };

        const satSummary = (answers) => {
            const dims = SAT_ITEMS.map((sec, si) => {
                const vals = sec.items.map((_, ii) => answers[si * 5 + ii]);
                const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
                return { name: sec.dim, mean };
            });
            const overall = dims.reduce((a, d) => a + d.mean, 0) / dims.length;
            const levelOf = (m) => m >= 4.51 ? 'มากที่สุด' : m >= 3.51 ? 'มาก' : m >= 2.51 ? 'ปานกลาง' : m >= 1.51 ? 'น้อย' : 'น้อยที่สุด';
            return { dims, overall, level: levelOf(overall) };
        };

        const SatisfactionSurvey = ({ onSubmit }) => {
            const [answers, setAnswers] = useState({});
            const [showErr, setShowErr] = useState(false);
            const totalItems = SAT_ITEMS.reduce((n, s) => n + s.items.length, 0);
            const answeredCount = Object.keys(answers).length;
            const allAnswered = answeredCount === totalItems;

            const submit = () => {
                if (!allAnswered) { setShowErr(true); return; }
                onSubmit(answers);
            };

            let counter = -1;
            return (
                <div className="max-w-3xl mx-auto p-4 sm:p-6 animate-fade-in">
                    <h2 className="text-2xl font-bold text-cyan-400 mb-1"><i className="fa-solid fa-star-half-stroke mr-2"></i>แบบประเมินความพึงพอใจต่อสื่อวิดีโอ</h2>
                    <p className="text-slate-500 text-sm mb-1">โปรดประเมินความคิดเห็นของท่านให้ครบ 15 ข้อ ({answeredCount}/{totalItems})</p>
                    <p className="text-slate-400 text-xs mb-4">5 = มากที่สุด · 4 = มาก · 3 = ปานกลาง · 2 = น้อย · 1 = น้อยที่สุด</p>
                    {showErr && !allAnswered && <div className="bg-red-100 border border-red-300 rounded-lg px-3 py-2 text-sm text-red-600 mb-4"><i className="fa-solid fa-triangle-exclamation mr-2"></i>กรุณาประเมินให้ครบทุกข้อก่อนส่งแบบประเมิน</div>}

                    {SAT_ITEMS.map((sec, si) => (
                        <div key={si} className="mb-5">
                            <h3 className="text-sm font-bold text-blue-700 mb-2">{sec.dim}</h3>
                            <div className="space-y-2">
                                {sec.items.map((text, ii) => {
                                    counter++;
                                    const gIdx = counter;
                                    return (
                                        <div key={ii} className="frost-card rounded-xl px-4 py-3 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3">
                                            <div className="flex-1 text-sm text-[#0f2440]">{gIdx + 1}. {text}</div>
                                            <div className="flex gap-1.5 justify-center sm:justify-end shrink-0">
                                                {SAT_SCALE.map(s => (
                                                    <button key={s} onClick={() => { setAnswers(a => ({ ...a, [gIdx]: s })); setShowErr(false); }}
                                                        title={SAT_SCALE_LABEL[s]}
                                                        className={`w-9 h-9 rounded-lg border text-sm font-bold transition ${answers[gIdx] === s ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-300 text-slate-500 hover:border-blue-400'}`}>
                                                        {s}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ))}

                    <button onClick={submit} className="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-lg font-bold rounded-xl shadow-lg border border-emerald-400 transition-all">
                        <i className="fa-solid fa-paper-plane mr-2"></i> ส่งแบบประเมิน
                    </button>
                </div>
            );
        };

        /* ============================================================
           สรุปผลรวม — คะแนนเกม + คะแนนความรู้ เฉลี่ยลงมาเป็นเต็ม 10
        ============================================================ */
        const FinalReport = ({ student, gameResult, quizResult, satAnswers, onRestart }) => {
            const final10 = ((gameResult.score + quizResult.score) / 20).toFixed(1);
            const passed = Number(final10) >= 5;
            const sat = satAnswers ? satSummary(satAnswers) : null;

            const [submitStatus, setSubmitStatus] = useState('idle');   // idle | sending | ok | error | nourl
            const canSubmit = !!APPS_SCRIPT_URL;
            const doSubmit = async () => {
                if (submitStatus === 'sending' || submitStatus === 'ok') return;
                if (!canSubmit) { setSubmitStatus('nourl'); return; }
                setSubmitStatus('sending');
                const res = await submitResultToSheet(buildResultPayload(student, gameResult, quizResult, satAnswers));
                setSubmitStatus(res.ok ? 'ok' : 'error');
            };
            useEffect(() => { if (canSubmit && submitStatus === 'idle') doSubmit(); }, []);
            return (
                <div className="max-w-2xl mx-auto p-4 sm:p-6 animate-fade-in">
                    <div className="frost-card rounded-3xl p-8 md:p-10 text-center">
                        <i className={`fa-solid ${passed ? 'fa-award text-cyan-300' : 'fa-clipboard-check text-sky-300'} text-7xl mb-4 drop-shadow-[0_0_22px_rgba(56,189,248,0.55)]`}></i>
                        <h2 className="text-3xl font-black text-white mb-1">สรุปผลการทดสอบ</h2>
                        <p className="text-sky-100 text-sm mb-6">{student.first} {student.last} · รหัส {student.id} · ห้อง {student.room}</p>

                        <div className="bg-[#08213f]/80 rounded-2xl p-6 border-2 border-sky-400/35 mb-6 glow-blue">
                            <div className="text-xs text-sky-300/60 uppercase tracking-widest">คะแนนรวม (เฉลี่ยจาก 2 ส่วน)</div>
                            <div className="text-6xl font-black text-cyan-300 leading-tight">{final10}<span className="text-2xl text-sky-300/50"> / 10</span></div>
                        </div>

                        <div className="grid grid-cols-2 gap-4 mb-6">
                            <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
                                <div className="text-xs text-slate-400 uppercase">คะแนนปฏิบัติ (เกม)</div>
                                <div className="text-3xl font-black text-blue-300">{gameResult.score}<span className="text-base text-slate-400">/100</span></div>
                            </div>
                            <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
                                <div className="text-xs text-slate-400 uppercase">คะแนนความรู้ (ปรนัย)</div>
                                <div className="text-3xl font-black text-emerald-300">{quizResult.score}<span className="text-base text-slate-400">/100</span></div>
                                <div className="text-xs text-slate-400 mt-0.5">ตอบถูก {quizResult.correct}/10 ข้อ</div>
                            </div>
                        </div>

                        {gameResult.feedback && <div className="text-left text-xs text-sky-100/80 bg-[#08213f]/60 rounded-lg p-3 mb-6 border border-sky-400/15">{gameResult.feedback}</div>}

                        {sat && (
                            <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 mb-6 text-left">
                                <div className="text-xs text-slate-400 uppercase mb-2"><i className="fa-solid fa-star-half-stroke mr-1"></i>ความพึงพอใจต่อสื่อวิดีโอของคุณ</div>
                                {sat.dims.map((d, i) => (
                                    <div key={i} className="flex justify-between text-xs text-sky-100/90 py-0.5">
                                        <span>{d.name}</span><span className="font-bold">{d.mean.toFixed(2)}/5</span>
                                    </div>
                                ))}
                                <div className="flex justify-between text-sm font-bold text-emerald-300 pt-2 mt-1 border-t border-slate-700">
                                    <span>เฉลี่ยรวม</span><span>{sat.overall.toFixed(2)}/5 · {sat.level}</span>
                                </div>
                            </div>
                        )}

                        {canSubmit && (
                            <button onClick={doSubmit} disabled={submitStatus === 'sending' || submitStatus === 'ok'}
                                className={`w-full mb-3 py-3 rounded-xl font-bold border transition-colors flex items-center justify-center ${
                                    submitStatus === 'ok' ? 'bg-cyan-500/15 border-cyan-400/50 text-cyan-700'
                                    : submitStatus === 'error' ? 'bg-red-500/15 border-red-400/50 text-red-600 hover:bg-red-500/25'
                                    : submitStatus === 'sending' ? 'bg-[#0e2850] border-sky-400/30 text-sky-100'
                                    : 'bg-[#0e2850] border-sky-400/30 text-sky-100 hover:bg-[#143567]'}`}>
                                <i className={`fa-solid ${submitStatus === 'ok' ? 'fa-circle-check' : submitStatus === 'sending' ? 'fa-spinner fa-spin' : submitStatus === 'error' ? 'fa-triangle-exclamation' : 'fa-cloud-arrow-up'} mr-2`}></i>
                                {submitStatus === 'ok' ? 'ส่งผลเข้าระบบแล้ว'
                                    : submitStatus === 'sending' ? 'กำลังส่งผล...'
                                    : submitStatus === 'error' ? 'ส่งไม่สำเร็จ — แตะเพื่อลองใหม่'
                                    : 'ส่งผลเข้าระบบ'}
                            </button>
                        )}

                        <button onClick={onRestart} className="px-6 py-3 rounded-xl bg-gradient-to-r from-sky-400 to-cyan-300 hover:from-sky-300 hover:to-cyan-200 text-[#062033] font-bold glow-blue transition-colors">
                            <i className="fa-solid fa-rotate-right mr-2"></i> เริ่มทดสอบใหม่ (คนถัดไป)
                        </button>
                    </div>
                </div>
            );
        };

        /* ============================================================
           กรอบเกม — หัวข้อโหมด + จับเวลา (เมื่อเลือกโหมดสอบจับเวลา)
        ============================================================ */
        const GameFrame = ({ mode, onDone }) => {
            const examTime = 240;
            const [left, setLeft] = useState(mode === 'exam' ? examTime : null);
            const doneRef = useRef(false);

            // ถ้าสลับโหมดระหว่างเล่น (ไม่ได้เริ่มรอบใหม่) ให้ตั้งเวลาใหม่ให้ตรงโหมด
            useEffect(() => {
                setLeft(mode === 'exam' ? examTime : null);
                doneRef.current = false;
            }, [mode]);

            useEffect(() => {
                if (mode !== 'exam' || left === null) return;
                if (left <= 0) {
                    if (!doneRef.current) { doneRef.current = true; onDone(0, '⏱ หมดเวลา — ปฏิบัติงานไม่เสร็จ'); }
                    return;
                }
                const t = setTimeout(() => setLeft(l => l - 1), 1000);
                return () => clearTimeout(t);
            }, [left, mode]);

            const finish = (s, f) => { if (doneRef.current) return; doneRef.current = true; onDone(s, f); };

            return (
                <div className="pb-16 animate-fade-in">
                    <div className="max-w-5xl mx-auto px-4 pt-4 flex items-center justify-end gap-3 flex-wrap">
                        <div className="flex items-center gap-2">
                            <span className={`text-xs px-3 py-1 rounded-full border ${mode === 'exam' ? 'border-red-500 text-red-400' : 'border-blue-500 text-blue-400'}`}>
                                {mode === 'exam' ? 'โหมดสอบจับเวลา' : 'โหมดฝึกซ้อม'}
                            </span>
                            {mode === 'exam' && <TimerPill left={left} />}
                        </div>
                    </div>
                    <GameCharging mode={mode} onFinish={finish} />
                </div>
            );
        };

        /* ============================================================
           APP — ลงทะเบียน → เล่นเกม → ทำแบบทดสอบ → สรุปผล
        ============================================================ */
        const App = () => {
            const [student, setStudent] = useState(null);
            const [stage, setStage] = useState('login');   // login | teacherGate | teacher | game | quiz | satisfaction | result
            const mode = 'exam';
            const [gameResult, setGameResult] = useState(null);   // {score, feedback}
            const [quizResult, setQuizResult] = useState(null);   // {score, correct}
            const [satAnswers, setSatAnswers] = useState(null);   // {0..14: 1-5}
            const [cheatMsg, setCheatMsg] = useState('');

            const startTest = (s) => { setStudent(s); setStage('game'); setCheatMsg(''); };
            const handleGameDone = (score, feedback) => { setGameResult({ score, feedback }); setStage('quiz'); };
            const handleQuizDone = (score, correct) => { setQuizResult({ score, correct }); setStage('satisfaction'); };
            const handleSatisfactionDone = (answers) => { setSatAnswers(answers); setStage('result'); };
            const restart = () => {
                setStudent(null); setStage('login');
                setGameResult(null); setQuizResult(null); setSatAnswers(null);
            };

            /* ---- กันโกง: ระหว่างทำแบบทดสอบ (เกม/ควิซ) ห้ามสลับแท็บ/ย่อหน้าต่าง (ไม่รวมช่วงประเมินความพึงพอใจ) ---- */
            const cheatActive = !!student && (stage === 'game' || stage === 'quiz');
            useEffect(() => {
                if (!cheatActive) return;
                let armed = false;
                const armT = setTimeout(() => { armed = true; }, 1000);   // เว้นช่วงตอนโหลด/เปลี่ยนขั้นตอน กันเตือนผิดพลาด
                let blurT;

                const violate = (reason) => {
                    if (!armed) return;
                    armed = false;
                    if (APPS_SCRIPT_URL) {
                        const p = buildResultPayload(student, gameResult, quizResult, satAnswers);
                        p.cheated = true; p.cheatReason = reason;
                        submitResultToSheet(p);   // fire-and-forget
                    }
                    setStudent(null); setStage('login');
                    setGameResult(null); setQuizResult(null); setSatAnswers(null);
                    setCheatMsg('ตรวจพบการออกจากหน้าจอระหว่างทำแบบทดสอบ (' + reason + ') — ระบบถือว่าทุจริต บันทึกผลไว้แล้ว และนำคุณออกจากระบบ กรุณาติดต่อผู้คุมสอบ');
                };

                const onVis = () => { if (document.visibilityState === 'hidden') violate('สลับหน้าจอ / ย่อหน้าต่าง / ปิดจอ'); };
                const onBlur = () => { blurT = setTimeout(() => { if (!document.hasFocus()) violate('สลับไปหน้าต่าง/แท็บ/แอปอื่น'); }, 450); };
                const onFocus = () => { clearTimeout(blurT); };
                const onPageHide = () => {
                    if (!armed) return;
                    if (APPS_SCRIPT_URL && navigator.sendBeacon) {
                        const p = buildResultPayload(student, gameResult, quizResult, satAnswers);
                        p.cheated = true; p.cheatReason = 'ปิด/ออกจากหน้าต่างระหว่างทำแบบทดสอบ';
                        try { navigator.sendBeacon(APPS_SCRIPT_URL, new Blob([JSON.stringify(p)], { type: 'text/plain;charset=utf-8' })); } catch (e) {}
                    }
                };

                document.addEventListener('visibilitychange', onVis);
                window.addEventListener('blur', onBlur);
                window.addEventListener('focus', onFocus);
                window.addEventListener('pagehide', onPageHide);
                return () => {
                    clearTimeout(armT); clearTimeout(blurT);
                    document.removeEventListener('visibilitychange', onVis);
                    window.removeEventListener('blur', onBlur);
                    window.removeEventListener('focus', onFocus);
                    window.removeEventListener('pagehide', onPageHide);
                };
            }, [cheatActive, student, gameResult, quizResult, satAnswers]);

            if (stage === 'teacherGate') return <TeacherGate onSuccess={() => setStage('teacher')} onBack={() => setStage('login')} />;
            if (stage === 'teacher') return <TeacherStats onBack={() => setStage('login')} />;

            let body;
            if (stage === 'game') body = <GameFrame mode={mode} onDone={handleGameDone} />;
            else if (stage === 'quiz') body = <QuizSection onSubmit={handleQuizDone} />;
            else if (stage === 'satisfaction') body = <SatisfactionSurvey onSubmit={handleSatisfactionDone} />;
            else if (stage === 'result') body = <FinalReport student={student} gameResult={gameResult} quizResult={quizResult} satAnswers={satAnswers} onRestart={restart} />;

            if (!student) return <div className="min-h-screen"><StudentLogin onStart={startTest} onTeacher={() => setStage('teacherGate')} cheatMsg={cheatMsg} /></div>;

            return (
                <div className="min-h-screen flex flex-col">
                    <div className="flex flex-col sm:flex-row justify-between items-center gap-2 sm:gap-3 px-3 py-2.5 sm:p-4 glass-panel sticky top-0 z-50 shadow-[0_8px_30px_-10px_rgba(2,15,40,0.7)] border-b border-sky-400/20">
                        <div className="flex items-center gap-2 sm:gap-3 min-w-0">
                            <i className="fa-solid fa-temperature-half text-sky-300 text-2xl sm:text-3xl drop-shadow-[0_0_10px_rgba(56,189,248,0.6)]"></i>
                            <div className="min-w-0">
                                <h1 className="text-base sm:text-xl font-extrabold leading-[1.4] py-1 text-transparent bg-clip-text bg-gradient-to-r from-blue-800 via-blue-700 to-blue-600 truncate">แบบทดสอบความรู้เรื่องเกจแมนิโฟลด์</h1>
                                <p className="text-[11px] sm:text-xs text-blue-700/70 truncate">แยกจากระบบสอบปฏิบัติช่างเครื่องทำความเย็น · เล่นเดี่ยว</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 sm:gap-3 flex-wrap justify-center shrink-0">
                            <span className="text-xs px-3 py-1.5 rounded-lg bg-white border border-sky-400/30 text-blue-700 font-bold">
                                <i className="fa-solid fa-user-graduate mr-1"></i>{student.first} {student.last} · {student.room}
                            </span>
                        </div>
                    </div>

                    <main className="flex-1 relative">
                        <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-sky-500/20 rounded-full blur-[130px] pointer-events-none -z-10"></div>
                        <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/15 rounded-full blur-[130px] pointer-events-none -z-10"></div>

                        {stage === 'quiz' && (
                            <div className="max-w-3xl mx-auto px-4 pt-4">
                                <div className="frost-card rounded-xl px-4 py-2 text-xs text-blue-800">
                                    <i className="fa-solid fa-circle-check mr-1 text-emerald-500"></i> เล่นเกมเสร็จแล้ว ได้ {gameResult.score}/100 คะแนน — ทำแบบทดสอบความรู้ต่อให้ครบเพื่อดูคะแนนรวม
                                </div>
                            </div>
                        )}

                        {stage === 'satisfaction' && (
                            <div className="max-w-3xl mx-auto px-4 pt-4">
                                <div className="frost-card rounded-xl px-4 py-2 text-xs text-blue-800">
                                    <i className="fa-solid fa-circle-check mr-1 text-emerald-500"></i> ทำแบบทดสอบความรู้เสร็จแล้ว ได้ {quizResult.score}/100 คะแนน — ประเมินความพึงพอใจให้ครบเพื่อดูคะแนนรวม
                                </div>
                            </div>
                        )}

                        {body}
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
